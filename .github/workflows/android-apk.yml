name: Build TV Tidy APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate and extract project
        id: project
        shell: bash
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f TVTidy/settings.gradle.kts ]; then
            echo "dir=TVTidy" >> "$GITHUB_OUTPUT"
          else
            ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "Project ZIP not found"
              exit 1
            fi

            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted

            PROJECT_FILE=$(find extracted -type f \
              -name settings.gradle.kts | head -n 1)

            if [ -z "$PROJECT_FILE" ]; then
              echo "settings.gradle.kts not found"
              exit 1
            fi

            echo "dir=$(dirname "$PROJECT_FILE")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        run: |
          gradle --no-daemon \
            -p "${{ steps.project.outputs.dir }}" \
            :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Tidy-debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
